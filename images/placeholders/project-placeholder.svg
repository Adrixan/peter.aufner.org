<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" fill="none">
  <!-- Background -->
  <rect width="400" height="225" fill="#1E1E1E"/>
  
  <!-- Grid pattern representing tech/code -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#4ADE80" stroke-width="0.5" opacity="0.1"/>
    </pattern>
    <linearGradient id="glow-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#A7F3D0" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="225" fill="url(#grid)"/>
  
  <!-- Decorative elements -->
  <circle cx="320" cy="60" r="80" fill="url(#glow-gradient)"/>
  <circle cx="80" cy="180" r="60" fill="url(#glow-gradient)"/>
  
  <!-- Code brackets decoration -->
  <text x="180" y="120" font-family="ui-monospace, monospace" font-size="48" fill="#4ADE80" opacity="0.3">{ }</text>
  
  <!-- Placeholder text -->
  <rect x="120" y="95" width="160" height="35" rx="4" fill="#121212" opacity="0.8"/>
  <text x="200" y="118" font-family="ui-monospace, monospace" font-size="12" fill="#4ADE80" text-anchor="middle">[PROJECT IMAGE]</text>
</svg>