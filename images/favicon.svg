<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
  </defs>

  <!-- Hexagon: structure / nature (BRANDING.md, Logo Concepts) -->
  <polygon points="8,1.5 24,1.5 31,16 24,30.5 8,30.5 1,16" fill="#121212" stroke="url(#accent-gradient)" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- PA monogram -->
  <text x="16" y="21" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="700"
        fill="url(#accent-gradient)" text-anchor="middle">PA</text>
</svg>
